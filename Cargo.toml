[package]
name = "mail-parser"
description = "Fast and robust e-mail parsing library for Rust"
version = "1.0.1"
edition = "2024"
rust-version = "1.98"
authors = [ "Stalwart Labs <hello@stalw.art>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/mail-parser"
homepage = "https://github.com/stalwartlabs/mail-parser"
keywords = ["email", "mail", "parser", "parse", "mime"]
categories = ["email", "parser-implementations"]
readme = "README.md"
exclude = ["benches/compare"]

[dependencies]
hashify = "0.3"
memchr = { version = "2.8", default-features = false }
simdutf8 = { version = "0.1", default-features = false }
encodify = { version = "1.0", default-features = false }
encoding_rs = { version = "0.8", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
serde_json = "1.0"
chrono = "0.4"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[features]
default = ["std"]
std = ["memchr/std", "simdutf8/std", "encodify/std", "serde?/std"]
full_encoding = ["dep:encoding_rs"]
serde = ["dep:serde"]

[[example]]
name = "mailbox_iterate_maildir"
required-features = ["std"]

[[example]]
name = "mailbox_parse_mbox"
required-features = ["std"]

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "text_prefix"
harness = false

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mail_parser_checked_str)"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.bench]
debug = true
